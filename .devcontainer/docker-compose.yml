# Two containers: "app" (Python 3.12, where VS Code runs) and "db" (PostgreSQL 16).
# app shares db's network, so the database is reachable at localhost:5432.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bmac
      SESSION_SECRET: dev-only-secret-not-for-production

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bmac
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run once, on first start, in filename order:
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db-init/02-dev-seed.sql:/docker-entrypoint-initdb.d/02-dev-seed.sql:ro

volumes:
  pgdata:
