{% extends "base.html" %}
{% block title %}Traceability Graph — BMAC{% endblock %}
{% block content %}
<h1 style="margin: 0;">Traceability Graph</h1>
<p style="margin: 4px 0 0; color: #999; font-size: 14px;">Click a node to trace its manufacturing path and see full details</p>

<div style="display: flex; gap: 16px; margin-top: 16px; align-items: flex-start;">
    <div id="network" style="flex: 1; min-width: 0; height: 700px; background: #0a0e1a; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);"></div>

    <div id="nodeCard" style="display: none; width: 320px; flex-shrink: 0; position: sticky; top: 20px;" class="result">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <h3 id="nodeCardTitle" style="margin: 0;"></h3>
            <span onclick="clearSelection()" style="cursor: pointer; color: #999; font-size: 20px; line-height: 1;">&times;</span>
        </div>
        <div id="nodeCardFields" style="margin-top: 12px;"></div>
        <div id="nodeCardChain" style="margin-top: 16px;"></div>
    </div>
</div>

<script>
    function shortLabel(id, group) {
        if (group === 'project') return id.replace('PROJECT-', '');
        if (group === 'material') return id;
        if (group === 'coating') return id.split('-').slice(-1)[0].replace('C', 'Coat ');
        if (group === 'slp') return 'SLP-' + id.split('-SLP-')[1];
        if (group === 'coincell') return 'CC-' + id.split('-CC-')[1];
        return id;
    }

    let network, nodesDS, edgesDS, pulseInterval;

    // --- Border scaling state ---
    // borderWidth in vis.js is in screen pixels; node size scales with zoom.
    // We track the current scale and re-apply borders on every zoom event so
    // the border thickness stays visually proportional to the node size.
    let currentScale = 1;

    // null  → no selection active (all nodes at normal style)
    // Set   → active selection; contains IDs on the highlighted path
    let currentSelectedPath = null;

    // Base border widths at scale 1. Multiplied by currentScale when applied.
    const BASE_BORDER = {
        normal:   2,   // no selection active
        selected: 4,   // on the highlighted path
        dimmed:   1    // off the highlighted path
    };

    function findPathToRoot(targetId, edges) {
        // Walk backwards through edges (child -> parent) until no parent found.
        // Excludes dashed project-reference edges — only follows real traceability links.
        const path = [targetId];
        let current = targetId;
        let guard = 0;
        while (guard++ < 20) {
            const parentEdge = edges.find(e => e.to === current && !e.dashes);
            if (!parentEdge) break;
            path.unshift(parentEdge.from);
            current = parentEdge.from;
        }
        return path;
    }

    function findDescendants(startId, edges) {
        // Follow real traceability links forward, from parent to child.
        const descendants = new Set([startId]);
        const queue = [startId];

        while (queue.length) {
            const current = queue.shift();
            edges
                .filter(edge => edge.from === current && !edge.dashes)
                .forEach(edge => {
                    if (!descendants.has(edge.to)) {
                        descendants.add(edge.to);
                        queue.push(edge.to);
                    }
                });
        }
        return descendants;
    }

    function clearSelection() {
        currentSelectedPath = null;
        document.getElementById('nodeCard').style.display = 'none';
        if (pulseInterval) clearInterval(pulseInterval);
        edgesDS.forEach(e => edgesDS.update({ id: e.id, color: { color: 'rgba(120,140,200,0.35)' }, width: 1.5 }));
        nodesDS.forEach(node => setNodeStyle(node, true));
    }

    const groupColors = {
            material: { background: '#00e5ff', border: '#00b8cc' },
            coating:  { background: '#7c4dff', border: '#5c35cc' },
            slp:      { background: '#00ff9d', border: '#00cc7d' },
            coincell: { background: '#ff6ec7', border: '#cc5599' },
            mlp:      { background: '#ffb800', border: '#cc9300' },
            project:  { background: '#ffffff', border: '#888888' }
            };

    // Assign level to groups for easier understanding
    const groupLevels = {
            material: 0,
            coating: 1,
            slp: 2,
            coincell: 2,
            mlp: 2,
            project: 3
    };


    function rgba(hex, opacity) {
        const value = parseInt(hex.slice(1), 16);
        return `rgba(${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}, ${opacity})`;
    }

    // isOnPath = true  → node is highlighted (or no selection is active, i.e. normal state)
    // isOnPath = false → node is dimmed because it is off the selected path
    function setNodeStyle(node, isOnPath) {
        const colors = groupColors[node.group];

        // Scale the border so it remains proportional to node size at any zoom level.
        const border = isOnPath
            ? BASE_BORDER.selected * currentScale
            : BASE_BORDER.dimmed   * currentScale;
        
        nodesDS.update({
            id: node.id,
            borderWidth: border,
            color: isOnPath
                ? { background: colors.background, border: colors.border }
                : { background: rgba(colors.background, 0.12), border: rgba(colors.border, 0.18) },
            font: {
                color: isOnPath ? '#e8e8f0' : 'rgba(232,232,240,0.22)',
                size: node.group === 'project' ? 14 : 12,
                bold: node.group === 'project'
            },
            shadow: isOnPath
                ? { enabled: true, color: colors.background, size: 10, x: 0, y: 0 }
                : { enabled: false }
        });
    }

     // Called on every zoom event. Re-applies the correct style (with updated
    // scale) to every node, respecting the current selection state.
    function onZoom(params) {
        currentScale = params.scale;
        if (currentSelectedPath !== null) {
            // Selection is active — re-apply highlight/dim with new border sizes.
            nodesDS.forEach(node => setNodeStyle(node, currentSelectedPath.has(node.id)));
        } else {
            // No selection — update all nodes to normal border width only.
            nodesDS.forEach(n => nodesDS.update({
                id: n.id,
                borderWidth: BASE_BORDER.normal * currentScale
            }));
        }
    }
    
    fetch('/api/graph')
        .then(res => res.json())
        .then(data => {
            
            nodesDS = new vis.DataSet(data.nodes.map(n => ({
                ...n,
                level: groupLevels[n.group],   // force same-group vertical alignment
                label: shortLabel(n.id, n.group),
                title: n.id + (n.title ? ' — ' + n.title : ''),
                shape: 'dot',
                size: n.group === 'project' ? 26 : 14,
                borderWidth: 2,
                color: { background: groupColors[n.group].background, border: groupColors[n.group].border },
                font: { color: '#e8e8f0', size: n.group === 'project' ? 14 : 12, bold: n.group === 'project' },
                shadow: { enabled: true, color: groupColors[n.group].background, size: 10, x: 0, y: 0 }
            })));

            edgesDS = new vis.DataSet(data.edges.map((e, i) => ({
                ...e,
                id: i,
                color: { color: 'rgba(120,140,200,0.35)' },
                width: 1.5,
                smooth: { type: 'cubicBezier', roundness: 0.4 }
            })));

            network = new vis.Network(document.getElementById('network'), { nodes: nodesDS, edges: edgesDS }, {
                layout: { hierarchical: { direction: 'UD', sortMethod: 'hubsize', levelSeparation: 130, nodeSpacing: 55 } },
                physics: { hierarchicalRepulsion: { nodeDistance: 85 } },
                interaction: { hover: true, tooltipDelay: 100 }
            });

            network.on('zoom', onZoom);

            network.on("click", async function(params) {
                if (pulseInterval) clearInterval(pulseInterval);

                if (params.nodes.length === 0) {
                    clearSelection();
                    return;
                }
                const nodeId = params.nodes[0];
                if (nodeId.startsWith('PROJECT-')) return;

                // Reset all edges/nodes first
                edgesDS.forEach(e => edgesDS.update({ id: e.id, color: { color: 'rgba(120,140,200,0.35)' }, width: 1.5 }));
                // nodesDS.forEach(n => nodesDS.update({ id: n.id, borderWidth: 2 }));
                nodesDS.forEach(node => setNodeStyle(node, true));

                // Trace the manufacturing path back to its root material
                const allEdges = edgesDS.get();
                const path = findPathToRoot(nodeId, allEdges);

                // Include the upstream path and every downstream traceability node.
                const downstreamNodes = findDescendants(nodeId, allEdges);
                const selectedPath = new Set([...path, ...downstreamNodes]);
                currentSelectedPath = selectedPath
                
                // Highlight all real edges within the selected traceability branch.
                const pathEdgeIds = allEdges
                    .filter(edge =>
                        !edge.dashes &&
                        selectedPath.has(edge.from) &&
                        selectedPath.has(edge.to)
                    )
                    .map(edge => edge.id);

                // Brighten selected/upstream/downstream nodes and dim all others.
                nodesDS.forEach(node => setNodeStyle(node, selectedPath.has(node.id)));

                // Pulsing animation along the path edges
                let bright = false;
                pulseInterval = setInterval(() => {
                    bright = !bright;
                    pathEdgeIds.forEach(id => edgesDS.update({
                        id,
                        color: { color: bright ? '#00e5ff' : '#0077aa' },
                        width: bright ? 4 : 2.5
                    }));
                }, 450);

                // Load and show the card
                const res = await fetch(`/api/card/${nodeId}`);
                if (!res.ok) return;
                const cardData = await res.json();
                document.getElementById('nodeCardTitle').textContent = cardData.record_id;
                document.getElementById('nodeCardFields').innerHTML = Object.entries(cardData.record)
                    .map(([k, v]) => `<div class="row"><span class="label">${k}</span><span class="value">${v}</span></div>`)
                    .join('');
                document.getElementById('nodeCardChain').innerHTML = cardData.chain.length
                    ? `<div style="font-size:12px;font-weight:700;color:#1b3a6b;margin-bottom:6px;">TRACEABILITY CHAIN</div>` +
                      cardData.chain.map(c => `<div style="font-size:13px;padding:3px 0;">${c}</div>`).join('')
                    : '';
                document.getElementById('nodeCard').style.display = 'block';
            });
        });
</script>
<div style="margin-top: 40px;">
    <div class="result">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;">
            <h3 style="margin: 0;">Cycling Data</h3>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="cyclingRecordId" placeholder="Record ID e.g. CAT-NMC-001-C001-CC-01" style="padding: 8px 10px; border-radius: 8px; border: 1px solid #dde2ee; font-size: 13px; width: 240px;">
                <select id="cyclingChartType" style="padding: 8px 10px; border-radius: 8px; border: 1px solid #dde2ee; font-size: 13px;">
                    <option value="voltage-capacity">Voltage vs Capacity</option>
                    <option value="capacity-fade">Capacity vs Cycle</option>
                    <option value="efficiency">Coulombic Efficiency vs Cycle</option>
                </select>
                <select id="cyclePicker" style="padding: 8px 10px; border-radius: 8px; border: 1px solid #dde2ee; font-size: 13px; display: none;">
                </select>
                <button id="loadCyclingBtn" style="margin: 0; padding: 8px 16px;">Load</button>
            </div>
        </div>
        <p id="cyclingStatus" style="font-size: 13px; color: #999; margin: 0 0 10px;"></p>
        <canvas id="cyclingGraphChart"></canvas>
    </div>
</div>

<script>
    let cyclingChart = null;
    let currentSummary = null;

    document.getElementById('cyclingChartType').addEventListener('change', (e) => {
        document.getElementById('cyclePicker').style.display = e.target.value === 'voltage-capacity' ? 'inline-block' : 'none';
    });

    async function loadCyclingSummary(recordId) {
        const res = await fetch(`/api/cycling/${recordId}/summary`);
        if (!res.ok) throw new Error('No cycling data found for this record');
        return await res.json();
    }

    async function loadSingleCycle(recordId, cycleNum) {
        const res = await fetch(`/api/cycling/${recordId}/cycle/${cycleNum}`);
        if (!res.ok) throw new Error('Could not load that cycle');
        return await res.json();
    }

    function renderChart(type, labels, values, label, xTitle, yTitle) {
        if (cyclingChart) cyclingChart.destroy();
        cyclingChart = new Chart(document.getElementById('cyclingGraphChart'), {
            type: type,
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: values,
                    borderColor: '#2e5fa3',
                    backgroundColor: type === 'line' ? 'rgba(46,95,163,0.08)' : '#2e5fa3',
                    fill: type === 'line',
                    tension: 0.1,
                    pointRadius: type === 'line' && values.length > 200 ? 0 : 3
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: true } },
                scales: {
                    x: { title: { display: true, text: xTitle } },
                    y: { title: { display: true, text: yTitle } }
                }
            }
        });
    }

    document.getElementById('loadCyclingBtn').addEventListener('click', async () => {
        const recordId = document.getElementById('cyclingRecordId').value.trim().toUpperCase();
        const chartType = document.getElementById('cyclingChartType').value;
        const status = document.getElementById('cyclingStatus');
        if (!recordId) { status.textContent = 'Enter a record ID first.'; return; }

        status.textContent = 'Loading...';
        try {
            currentSummary = await loadCyclingSummary(recordId);

            if (chartType === 'capacity-fade') {
                renderChart('bar', currentSummary.cycles, currentSummary.capacity_per_cycle, 'Capacity (mAh)', 'Half-cycle', 'Capacity (mAh)');
                status.textContent = `${currentSummary.cycles.length} half-cycles loaded for ${recordId}.`;

            } else if (chartType === 'efficiency') {
                renderChart('line', currentSummary.efficiency_cycle_numbers, currentSummary.efficiency, 'Coulombic Efficiency (%)', 'Cycle', 'Efficiency (%)');
                status.textContent = `${currentSummary.efficiency.length} cycle pairs analysed for ${recordId}.`;

            } else if (chartType === 'voltage-capacity') {
                const picker = document.getElementById('cyclePicker');
                picker.innerHTML = currentSummary.cycles.map(c => `<option value="${c}">Half-cycle ${c}</option>`).join('');
                picker.style.display = 'inline-block';
                const firstCycle = currentSummary.cycles[0];
                const cycleData = await loadSingleCycle(recordId, firstCycle);
                renderChart('line', cycleData.capacity_mah.map((_, i) => i), cycleData.voltage_v, `Half-cycle ${firstCycle}`, 'Sample index', 'Voltage (V)');
                status.textContent = `Showing half-cycle ${firstCycle} of ${currentSummary.cycles.length} for ${recordId}.`;

                picker.onchange = async () => {
                    const cycleData = await loadSingleCycle(recordId, picker.value);
                    renderChart('line', cycleData.capacity_mah.map((_, i) => i), cycleData.voltage_v, `Half-cycle ${picker.value}`, 'Sample index', 'Voltage (V)');
                    status.textContent = `Showing half-cycle ${picker.value} of ${currentSummary.cycles.length} for ${recordId}.`;
                };
            }
        } catch (err) {
            status.textContent = err.message;
        }
    });
</script>
{% endblock %}
