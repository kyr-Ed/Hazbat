{% extends "base.html" %}
{% block title %}Traceability Graph — BMAC{% endblock %}
{% block content %}
<h1 style="margin: 0;">Traceability Graph</h1>
<p style="margin: 4px 0 0; color: #999; font-size: 14px;">Click a node to trace its manufacturing path and see full details</p>

<div style="display: flex; gap: 16px; margin-top: 16px; align-items: flex-start;">
    <div id="network" style="flex: 1; min-width: 0; height: 700px; background: #0a0e1a; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);"></div>

    <div id="nodeCard" style="display: none; width: 320px; flex-shrink: 0; position: sticky; top: 20px;" class="result">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <h3 id="nodeCardTitle" style="margin: 0;"></h3>
            <span onclick="clearSelection()" style="cursor: pointer; color: #999; font-size: 20px; line-height: 1;">&times;</span>
        </div>
        <div id="nodeCardFields" style="margin-top: 12px;"></div>
        <div id="nodeCardChain" style="margin-top: 16px;"></div>
    </div>
</div>

<script>
    function shortLabel(id, group) {
        if (group === 'project') return id.replace('PROJECT-', '');
        if (group === 'material') return id;
        if (group === 'coating') return id.split('-').slice(-1)[0].replace('C', 'Coat ');
        if (group === 'slp') return 'SLP-' + id.split('-SLP-')[1];
        if (group === 'coincell') return 'CC-' + id.split('-CC-')[1];
        return id;
    }

    let network, nodesDS, edgesDS, pulseInterval;

    function findPathToRoot(targetId, edges) {
        // Walk backwards through edges (child -> parent) until no parent found.
        // Excludes dashed project-reference edges — only follows real traceability links.
        const path = [targetId];
        let current = targetId;
        let guard = 0;
        while (guard++ < 20) {
            const parentEdge = edges.find(e => e.to === current && !e.dashes);
            if (!parentEdge) break;
            path.unshift(parentEdge.from);
            current = parentEdge.from;
        }
        return path;
    }

    function clearSelection() {
        document.getElementById('nodeCard').style.display = 'none';
        if (pulseInterval) clearInterval(pulseInterval);
        edgesDS.forEach(e => edgesDS.update({ id: e.id, color: { color: 'rgba(120,140,200,0.35)' }, width: 1.5 }));
        nodesDS.forEach(node => setNodeStyle(node, true));
    }

    const groupColors = {
            material: { background: '#00e5ff', border: '#00b8cc' },
            coating:  { background: '#7c4dff', border: '#5c35cc' },
            slp:      { background: '#00ff9d', border: '#00cc7d' },
            coincell: { background: '#ff6ec7', border: '#cc5599' },
            mlp:      { background: '#ffb800', border: '#cc9300' },
            project:  { background: '#ffffff', border: '#888888' }
            };

    // Assign level to groups for easier understanding
    const groupLevels = {
            material: 0,
            coating: 1,
            slp: 2,
            coincell: 2,
            mlp: 2,
            project: 3
    };

    //dimmer to unselected nodes?

    function rgba(hex, opacity) {
        const value = parseInt(hex.slice(1), 16);
        return `rgba(${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}, ${opacity})`;
    }

    function setNodeStyle(node, isOnPath) {
        const colors = groupColors[node.group];
        nodesDS.update({
            id: node.id,
            borderWidth: isOnPath ? 4 : 1,
            color: isOnPath
                ? { background: colors.background, border: colors.border }
                : { background: rgba(colors.background, 0.12), border: rgba(colors.border, 0.18) },
            font: {
                color: isOnPath ? '#e8e8f0' : 'rgba(232,232,240,0.22)',
                size: node.group === 'project' ? 14 : 12,
                bold: node.group === 'project'
            },
            shadow: isOnPath
                ? { enabled: true, color: colors.background, size: 10, x: 0, y: 0 }
                : { enabled: false }
        });
    }

    
    fetch('/api/graph')
        .then(res => res.json())
        .then(data => {
            
            nodesDS = new vis.DataSet(data.nodes.map(n => ({
                ...n,
                level: groupLevels[n.group],   // force same-group vertical alignment
                label: shortLabel(n.id, n.group),
                title: n.id + (n.title ? ' — ' + n.title : ''),
                shape: 'dot',
                size: n.group === 'project' ? 26 : 14,
                borderWidth: 2,
                color: { background: groupColors[n.group].background, border: groupColors[n.group].border },
                font: { color: '#e8e8f0', size: n.group === 'project' ? 14 : 12, bold: n.group === 'project' },
                shadow: { enabled: true, color: groupColors[n.group].background, size: 10, x: 0, y: 0 }
            })));

            edgesDS = new vis.DataSet(data.edges.map((e, i) => ({
                ...e,
                id: i,
                color: { color: 'rgba(120,140,200,0.35)' },
                width: 1.5,
                smooth: { type: 'cubicBezier', roundness: 0.4 }
            })));

            network = new vis.Network(document.getElementById('network'), { nodes: nodesDS, edges: edgesDS }, {
                layout: { hierarchical: { direction: 'UD', sortMethod: 'hubsize', levelSeparation: 130, nodeSpacing: 55 } },
                physics: { hierarchicalRepulsion: { nodeDistance: 85 } },
                interaction: { hover: true, tooltipDelay: 100 }
            });

            network.on("click", async function(params) {
                if (pulseInterval) clearInterval(pulseInterval);

                if (params.nodes.length === 0) {
                    clearSelection();
                    return;
                }
                const nodeId = params.nodes[0];
                if (nodeId.startsWith('PROJECT-')) return;

                // Reset all edges/nodes first
                edgesDS.forEach(e => edgesDS.update({ id: e.id, color: { color: 'rgba(120,140,200,0.35)' }, width: 1.5 }));
                // nodesDS.forEach(n => nodesDS.update({ id: n.id, borderWidth: 2 }));
                nodesDS.forEach(node => setNodeStyle(node, true));

                // Trace the manufacturing path back to its root material
                const allEdges = edgesDS.get();
                const path = findPathToRoot(nodeId, allEdges);
                const pathEdgeIds = [];
                for (let i = 0; i < path.length - 1; i++) {
                    const edge = allEdges.find(e => e.from === path[i] && e.to === path[i + 1]);
                    if (edge) pathEdgeIds.push(edge.id);
                }

                // Highlight the path nodes
                // path.forEach(id => nodesDS.update({ id, borderWidth: 4 }));
                // dimmer?
                const selectedPath = new Set(path);
                nodesDS.forEach(node => setNodeStyle(node, selectedPath.has(node.id)));

                // Pulsing animation along the path edges
                let bright = false;
                pulseInterval = setInterval(() => {
                    bright = !bright;
                    pathEdgeIds.forEach(id => edgesDS.update({
                        id,
                        color: { color: bright ? '#00e5ff' : '#0077aa' },
                        width: bright ? 4 : 2.5
                    }));
                }, 450);

                // Load and show the card
                const res = await fetch(`/api/card/${nodeId}`);
                if (!res.ok) return;
                const cardData = await res.json();
                document.getElementById('nodeCardTitle').textContent = cardData.record_id;
                document.getElementById('nodeCardFields').innerHTML = Object.entries(cardData.record)
                    .map(([k, v]) => `<div class="row"><span class="label">${k}</span><span class="value">${v}</span></div>`)
                    .join('');
                document.getElementById('nodeCardChain').innerHTML = cardData.chain.length
                    ? `<div style="font-size:12px;font-weight:700;color:#1b3a6b;margin-bottom:6px;">TRACEABILITY CHAIN</div>` +
                      cardData.chain.map(c => `<div style="font-size:13px;padding:3px 0;">${c}</div>`).join('')
                    : '';
                document.getElementById('nodeCard').style.display = 'block';
            });
        });
</script>
{% endblock %}
